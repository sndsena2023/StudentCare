<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>บันทึกน้ำหนัก - ส่วนสูง</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 10px;">
        <h2 class="header-title" style="margin: 0;">⚖️ บันทึกสุขภาพ <span style="color: var(--primary); margin-left:8px;" id="displayClass"></span></h2>
        <button class="btn btn-outline" onclick="window.location.href='index.html'">← กลับหน้าหลัก</button>
    </div>

    <div class="card grid-3">
        <div class="form-group"><label>ภาคเรียนที่</label><select id="termInput" onchange="filterStudents()"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
        <div class="form-group">
            <label>ปีการศึกษา (พ.ศ.)</label>
            <select id="yearInput" onchange="filterStudents()">
                <option value="2569" selected>2569</option><option value="2570">2570</option>
                <option value="2571">2571</option><option value="2572">2572</option>
                <option value="2573">2573</option><option value="2574">2574</option>
            </select>
        </div>
        <div class="form-group">
            <label>ประจำเดือน</label>
            <select id="monthSelect" onchange="filterStudents()">
                <option value="พฤษภาคม">พฤษภาคม</option><option value="มิถุนายน">มิถุนายน</option>
                <option value="กรกฎาคม">กรกฎาคม</option><option value="สิงหาคม">สิงหาคม</option>
                <option value="กันยายน">กันยายน</option><option value="ตุลาคม">ตุลาคม</option>
                <option value="พฤศจิกายน">พฤศจิกายน</option><option value="ธันวาคม">ธันวาคม</option>
                <option value="มกราคม">มกราคม</option><option value="กุมภาพันธ์">กุมภาพันธ์</option><option value="มีนาคม">มีนาคม</option>
            </select>
        </div>
        <div class="form-group" style="grid-column: 1 / -1;"><label>ครูประจำชั้น</label><input type="text" id="teacherInput" readonly style="background:#f9fafb; color:var(--text-muted);"></div>
    </div>

    <div id="readOnlyBanner" class="alert alert-warning">⚠️ โหมดดูข้อมูลย้อนหลัง (ไม่อนุญาตให้แก้ไขข้อมูล แจ้งแอดมินเพื่อปลดล็อก)</div>

    <div class="table-wrapper">
        <table id="healthTable">
            <thead>
                <tr>
                    <th rowspan="2" style="width: 40px; min-width: 40px; max-width: 40px;">ที่</th>
                    <th rowspan="2" style="min-width: 160px;">ชื่อ - สกุล</th>
                    <th rowspan="2" style="width: 45px; min-width: 45px; max-width: 45px;">เพศ</th>
                    <th colspan="2">อายุ</th>
                    <th rowspan="2" style="width: 75px; min-width: 75px; max-width: 75px;">น้ำหนัก<br>(กก.)</th>
                    <th rowspan="2" style="width: 75px; min-width: 75px; max-width: 75px;">ส่วนสูง<br>(ซม.)</th>
                    <th rowspan="2" style="width: 75px; min-width: 75px; max-width: 75px;">รอบศีรษะ<br>(ซม.)</th>
                    <th colspan="2">สรุปภาวะโภชนาการอัตโนมัติ</th>
                </tr>
                <tr>
                    <th style="width: 50px; min-width: 50px; max-width: 50px;">ปี</th>
                    <th style="width: 50px; min-width: 50px; max-width: 50px;">เดือน</th>
                    <th style="min-width: 140px;">น้ำหนักตามเกณฑ์ส่วนสูง</th>
                    <th style="min-width: 140px;">ส่วนสูงตามเกณฑ์อายุ</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <button class="btn btn-primary btn-block" style="padding: 16px; font-size: 16px;" onclick="exportToExcel()">💾 ดาวน์โหลดไฟล์ Excel</button>
</div>
<div id="save-status">✅ บันทึกอัตโนมัติเรียบร้อย</div>

<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<script>
    let allStudents = []; let currentStudents = [];
    let isClassUnlocked = false; 
    const className = sessionStorage.getItem("currentClass");
    const activeTerm = sessionStorage.getItem('activeTerm') || "1";
    const activeYear = sessionStorage.getItem('activeYear') || "2569";

    window.onload = async () => {
        if (!className) return window.location.href = "index.html";
        document.getElementById("displayClass").innerText = className;
        
        document.getElementById('termInput').value = activeTerm;
        document.getElementById('yearInput').value = activeYear;
        const loggedInUser = sessionStorage.getItem('loggedInTeacher');
        if (loggedInUser) document.getElementById("teacherInput").value = JSON.parse(loggedInUser).name;

        try {
            const unlockSnap = await db.collection('Settings').doc('UnlockConfig').get();
            if (unlockSnap.exists && unlockSnap.data().classes) isClassUnlocked = unlockSnap.data().classes.includes(className);
            const snapshot = await db.collection('Students').get();
            snapshot.forEach(doc => { let data = doc.data(); data.docId = doc.id; allStudents.push(data); });
            filterStudents();
        } catch (error) { console.error(error); alert("เชื่อมต่อฐานข้อมูลล้มเหลว"); }
    };

    function filterStudents() {
        const selectedTerm = document.getElementById('termInput').value;
        const selectedYear = document.getElementById('yearInput').value;
        let classKey = Object.keys(allStudents[0] || {}).find(k => k.includes("ชั้น") || k.includes("ห้อง")) || "ชั้นเรียน";
        currentStudents = allStudents.filter(std => {
            let classMatch = (std[classKey] === className);
            let termMatch = (std.term === selectedTerm || (!std.term && selectedTerm === activeTerm));
            let yearMatch = (std.academicYear === selectedYear || (!std.academicYear && selectedYear === activeYear));
            return classMatch && termMatch && yearMatch;
        });
        loadHealthData();
    }

    async function loadHealthData() {
        const month = document.getElementById('monthSelect').value;
        const selectedYearVal = document.getElementById('yearInput').value;
        const selectedTerm = document.getElementById('termInput').value;
        const banner = document.getElementById('readOnlyBanner');
        const tbody = document.getElementById("tableBody");

        const monthMap = {"มกราคม":1, "กุมภาพันธ์":2, "มีนาคม":3, "เมษายน":4, "พฤษภาคม":5, "มิถุนายน":6, "กรกฎาคม":7, "สิงหาคม":8, "กันยายน":9, "ตุลาคม":10, "พฤศจิกายน":11, "ธันวาคม":12};
        let selM = monthMap[month];
        let calYear = parseInt(selectedYearVal) - 543;
        if (selM <= 3) calYear += 1; 
        let selectedDateVal = calYear * 100 + selM;
        let currentM = new Date().getMonth() + 1;
        let currentY = new Date().getFullYear();
        let currentDateVal = currentY * 100 + currentM;

        let isPastMonth = (selectedDateVal < currentDateVal);
        let isReadOnly = (selectedTerm !== activeTerm || selectedYearVal !== activeYear || isPastMonth);

        if (isClassUnlocked) {
            isReadOnly = false;
            banner.style.display = "block";
            banner.className = "alert alert-success";
            banner.innerText = "🟢 แอดมินปลดล็อกให้สามารถแก้ไขข้อมูลย้อนหลังได้";
        } else if (isReadOnly) {
            banner.style.display = "block";
            banner.className = "alert alert-warning";
            banner.innerText = "⚠️ โหมดดูข้อมูลย้อนหลัง (ไม่อนุญาตให้แก้ไข แจ้งแอดมินเพื่อปลดล็อก)";
        } else { banner.style.display = "none"; }
        
        if (currentStudents.length === 0) {
            tbody.innerHTML = "<tr><td colspan='10' style='padding:20px; color:red;'>ไม่มีข้อมูลนักเรียนในเทอม/ปีที่เลือก</td></tr>"; return;
        }
        tbody.innerHTML = "<tr><td colspan='10'>⏳ กำลังโหลดข้อมูล...</td></tr>";

        try {
            const recordsSnapshot = await db.collection('HealthRecords').where('className', '==', className).where('month', '==', month).where('year', '==', selectedYearVal).get();
            let savedRecords = {};
            recordsSnapshot.forEach(doc => { savedRecords[doc.data().studentId] = doc.data(); });

            tbody.innerHTML = "";
            currentStudents.forEach((student, index) => {
                const stuId = student.docId;
                const age = calculateAge(student['วันเกิด'] || student['วัน/เดือน/ปีเกิด'] || "");
                const savedW = savedRecords[stuId] && savedRecords[stuId].weight ? savedRecords[stuId].weight : "";
                const savedH = savedRecords[stuId] && savedRecords[stuId].height ? savedRecords[stuId].height : "";
                const savedHC = savedRecords[stuId] && savedRecords[stuId].headCircum ? savedRecords[stuId].headCircum : "";
                const disabledAttr = isReadOnly ? "disabled" : "";

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td><b>${student['ชื่อ-สกุล'] || student['ชื่อ - สกุล'] || ""}</b></td>
                    <td>${student['เพศ'] || "-"}</td><td>${age.y}</td><td>${age.m}</td>
                    <td><input type="number" class="input-hw" id="w_${stuId}" value="${savedW}" step="0.1" ${disabledAttr} onchange="autoSaveHealth('${stuId}', '${student['เพศ']}')"></td>
                    <td><input type="number" class="input-hw" id="h_${stuId}" value="${savedH}" step="0.1" ${disabledAttr} onchange="autoSaveHealth('${stuId}', '${student['เพศ']}')"></td>
                    <td><input type="number" class="input-hw" id="hc_${stuId}" value="${savedHC}" step="0.1" ${disabledAttr} onchange="autoSaveHealth('${stuId}', '${student['เพศ']}')"></td>
                    <td><span class="badge badge-empty" id="badge_wh_${stuId}">รอข้อมูล</span></td><td><span class="badge badge-empty" id="badge_ha_${stuId}">รอข้อมูล</span></td>
                `;
                tbody.appendChild(tr);
                if(savedW && savedH) updateNutritionUI(stuId, student['เพศ'], parseFloat(savedW), parseFloat(savedH));
            });
        } catch (e) { tbody.innerHTML = `<tr><td colspan='10' style='color:red;'>❌ โหลดข้อมูลไม่สำเร็จ: ${e.message}</td></tr>`; }
    }

    async function autoSaveHealth(studentId, gender) {
        const month = document.getElementById('monthSelect').value;
        const year = document.getElementById('yearInput').value;
        let wVal = document.getElementById(`w_${studentId}`).value;
        let hVal = document.getElementById(`h_${studentId}`).value;
        let hcVal = document.getElementById(`hc_${studentId}`).value;
        const w = wVal !== "" ? parseFloat(wVal) : "";
        const h = hVal !== "" ? parseFloat(hVal) : "";
        const hc = hcVal !== "" ? parseFloat(hcVal) : "";

        if (w !== "" && h !== "") updateNutritionUI(studentId, gender, w, h);

        try {
            await db.collection('HealthRecords').doc(`${studentId}_${month}_${year}`).set({ studentId: studentId, month: month, year: year, weight: w, height: h, headCircum: hc, className: className }, { merge: true });
            showToast("✅ บันทึกอัตโนมัติเรียบร้อย");
        } catch (error) { console.error(error); }
    }

    function showToast(msg) {
        const t = document.getElementById('save-status'); t.innerText = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    function updateNutritionUI(stuId, gender, w, h) {
        let bmi = w / ((h/100) * (h/100));
        let whResult = "สมส่วน"; let whClass = "badge-normal"; let haResult = "สูงตามเกณฑ์"; let haClass = "badge-normal";
        if (bmi < 15) { whResult = "ผอม"; whClass = "badge-danger"; } else if (bmi < 16.5) { whResult = "ค่อนข้างผอม"; whClass = "badge-warning"; } else if (bmi > 23) { whResult = "อ้วน"; whClass = "badge-danger"; } else if (bmi > 20) { whResult = "เริ่มอ้วน"; whClass = "badge-warning"; }
        if (h < 120) { haResult = "เตี้ย"; haClass = "badge-danger"; } else if (h > 155) { haResult = "สูง"; haClass = "badge-normal"; }
        document.getElementById(`badge_wh_${stuId}`).className = `badge ${whClass}`; document.getElementById(`badge_wh_${stuId}`).innerText = whResult;
        document.getElementById(`badge_ha_${stuId}`).className = `badge ${haClass}`; document.getElementById(`badge_ha_${stuId}`).innerText = haResult;
    }

    function calculateAge(dobString) {
        if (!dobString) return { y: "-", m: "-" };
        let parts = dobString.split('/'); if(parts.length !== 3) return { y: "-", m: "-" };
        let year = parseInt(parts[2]); if (year > 2400) year -= 543; 
        let dob = new Date(year, parseInt(parts[1]) - 1, parseInt(parts[0]));
        let today = new Date(); let ageY = today.getFullYear() - dob.getFullYear(); let ageM = today.getMonth() - dob.getMonth();
        if (ageM < 0 || (ageM === 0 && today.getDate() < dob.getDate())) { ageY--; ageM += 12; }
        return { y: ageY, m: ageM };
    }

    function exportToExcel() {
        const month = document.getElementById("monthSelect").value;
        const term = document.getElementById("termInput").value;
        const year = document.getElementById("yearInput").value;
        const teacher = document.getElementById("teacherInput").value;

        let exportData = [
            ["แบบบันทึกน้ำหนัก - ส่วนสูง", `ประจำเดือน ${month}`],
            [`ชั้น ${className}`, `ภาคเรียนที่ ${term}`, `ปีการศึกษา ${year}`, `ครูประจำชั้น ${teacher}`], [],
            ["ลำดับที่", "ชื่อ - สกุล", "เพศ", "อายุ (ปี)", "อายุ (เดือน)", "น้ำหนัก", "ส่วนสูง", "รอบศีรษะ", "ผอม", "ค่อนข้างผอม", "สมส่วน", "ท้วม", "เริ่มอ้วน", "อ้วน", "เตี้ย", "ค่อนข้างเตี้ย", "สูงตามเกณฑ์", "ค่อนข้างสูง", "สูง"]
        ];

        currentStudents.forEach((student, index) => {
            const age = calculateAge(student['วันเกิด'] || student['วัน/เดือน/ปีเกิด'] || "");
            const w = document.getElementById(`w_${student.docId}`).value || "";
            const h = document.getElementById(`h_${student.docId}`).value || "";
            const hc = document.getElementById(`hc_${student.docId}`).value || "";
            
            let row = [index + 1, student['ชื่อ-สกุล'] || student['ชื่อ - สกุล'] || "", student['เพศ'] || "", age.y, age.m, w, h, hc];
            let whResult = document.getElementById(`badge_wh_${student.docId}`).innerText; let haResult = document.getElementById(`badge_ha_${student.docId}`).innerText;
            ["ผอม", "ค่อนข้างผอม", "สมส่วน", "ท้วม", "เริ่มอ้วน", "อ้วน"].forEach(opt => row.push(whResult === opt ? "/" : ""));
            ["เตี้ย", "ค่อนข้างเตี้ย", "สูงตามเกณฑ์", "ค่อนข้างสูง", "สูง"].forEach(opt => row.push(haResult === opt ? "/" : ""));
            exportData.push(row);
        });

        const ws = XLSX.utils.aoa_to_sheet(exportData);
        ws['!cols'] = [{wch: 8}, {wch: 30}, {wch: 6}, {wch: 8}, {wch: 10}, {wch: 8}, {wch: 8}, {wch: 10}];
        for(let i=0; i<11; i++) ws['!cols'].push({wch: 10});
        const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, `เดือน ${month}`);
        XLSX.writeFile(wb, `บันทึกสุขภาพ_ชั้น${className.replace('/', '-')}_${month}.xlsx`);
    }
</script>
</body>
</html>
