<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบบันทึกสุขภาพนักเรียน</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container" style="max-width: 450px; margin-top: 5vh;">
    <div id="login-section" class="card" style="text-align: center;">
        <img src="logo.png" alt="โลโก้โรงเรียน" class="logo-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2966/2966327.png';">
        <h2 style="color: var(--primary);">เข้าสู่ระบบครูประจำชั้น</h2>
        <p style="color: var(--text-muted); margin-bottom: 24px;">ระบบบันทึกสุขภาพและการดื่มนม</p>
        
        <div class="form-group" style="text-align: left;">
            <label>รหัสประจำตัวอาจารย์</label>
            <input type="text" id="usernameInput" placeholder="เช่น T001">
        </div>
        <div class="form-group" style="text-align: left;">
            <label>รหัสผ่าน</label>
            <input type="password" id="passwordInput" placeholder="••••••••">
        </div>
        
        <button class="btn btn-primary btn-block" onclick="login()">เข้าสู่ระบบ</button>
        <div id="login-error" style="color: var(--danger); font-size: 14px; margin-top: 15px; display: none;"></div>
    </div>

    <div id="change-pwd-section" class="card" style="display: none; text-align: center;">
        <h2 style="color: var(--warning);">เปลี่ยนรหัสผ่านครั้งแรก</h2>
        <p style="color: var(--text-muted); margin-bottom: 24px;">เพื่อความปลอดภัย กรุณาตั้งรหัสผ่านใหม่</p>
        <div class="form-group" style="text-align: left;">
            <input type="password" id="newPassword" placeholder="รหัสผ่านใหม่ (อย่างน้อย 4 ตัว)">
        </div>
        <div class="form-group" style="text-align: left;">
            <input type="password" id="confirmPassword" placeholder="ยืนยันรหัสผ่านใหม่อีกครั้ง">
        </div>
        <button class="btn btn-success btn-block" onclick="saveNewPassword()">บันทึกรหัสผ่านใหม่</button>
        <div id="pwd-error" style="color: var(--danger); font-size: 14px; margin-top: 15px; display: none;"></div>
    </div>

    <div id="dashboard-section" style="display: none;">
        <div class="card" style="text-align: center;">
            <div id="greeting" style="color: var(--primary); font-size: 18px; font-weight: 600; margin-bottom: 8px;">✨ สวัสดี</div>
            <h2 style="margin-bottom: 24px;">ระบบจัดการชั้นเรียน</h2>
            
            <div style="background: #F0FDF4; border: 1px solid #BBF7D0; padding: 16px; border-radius: var(--radius); margin-bottom: 24px;">
                <p id="displayTeacherName" style="font-size: 18px; font-weight: bold; color: var(--secondary); margin: 0 0 8px 0;">ครู...</p>
                <p style="font-size: 15px; color: #065F46; margin: 0;">📌 รับผิดชอบชั้น: <span id="displayTeacherClass" style="font-weight:bold;">-</span></p>
            </div>

            <button class="btn btn-primary btn-block" style="margin-bottom: 12px; font-size: 16px; padding: 16px;" onclick="goTo('milk')">🥛 บันทึกการดื่มนม</button>
            <button class="btn btn-success btn-block" style="margin-bottom: 24px; font-size: 16px; padding: 16px;" onclick="goTo('health')">⚖️ บันทึกน้ำหนัก-ส่วนสูง</button>
            
            <button class="btn btn-outline" style="border:none; color: var(--danger);" onclick="logout()">ออกจากระบบ</button>
        </div>
    </div>
</div>

<div class="secret-admin-btn" onclick="window.location.href='admin.html'" title="Admin Mode">⚙️</div>

<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<script src="app.js"></script>
</body>
</html>
