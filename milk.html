<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>บันทึกการดื่มนม</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="page-header">
        <h2 class="header-title">🥛 บันทึกดื่มนม <span style="color: var(--secondary);" id="displayClass"></span></h2>
        <button class="btn btn-outline" onclick="window.location.href='index.html'">← กลับหน้าหลัก</button>
    </div>
    
    <div class="card grid-3">
        <div class="form-group"><label>ภาคเรียนที่</label><select id="termInput" onchange="filterStudents()"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
        <div class="form-group">
            <label>ปีการศึกษา (พ.ศ.)</label>
            <select id="yearInput" onchange="filterStudents()">
                <option value="2569" selected>2569</option><option value="2570">2570</option>
                <option value="2571">2571</option><option value="2572">2572</option>
                <option value="2573">2573</option><option value="2574">2574</option>
            </select>
        </div>
        <div class="form-group"><label>เลือกวันที่บันทึก</label><input type="date" id="recordDate" onchange="filterStudents()"></div>
    </div>

    <div id="readOnlyBanner" class="alert alert-warning">⚠️ โหมดดูข้อมูลย้อนหลัง (ไม่อนุญาตให้แก้ไขข้อมูล แจ้งแอดมินเพื่อปลดล็อก)</div>
    <div id="holidayAlert" class="alert alert-danger">⛔ วันนี้เป็นวันหยุด: <span id="holidayName"></span></div>

    <div class="table-wrapper" id="tableContainer">
        <table id="milkTable">
            <thead>
                <tr>
                    <th style="width: 50px; min-width: 50px; max-width: 50px;">ที่</th>
                    <th style="min-width: 160px;">ชื่อ - สกุล</th>
                    <th style="width: 100px; min-width: 100px; max-width: 100px;">ดื่มนม ✔️</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <button class="btn btn-success btn-block" style="padding: 16px; font-size: 16px;" onclick="exportMonthlyToExcel()">💾 ดาวน์โหลดไฟล์ Excel (สรุปทั้งเดือน)</button>
</div>
<div id="save-status">✅ บันทึกอัตโนมัติเรียบร้อย</div>

<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<script>
    let allStudents = []; let currentStudents = []; let currentHolidays = {};
    let isClassUnlocked = false; 
    const className = sessionStorage.getItem("currentClass");
    const activeTerm = sessionStorage.getItem('activeTerm') || "1";
    const activeYear = sessionStorage.getItem('activeYear') || "2569";

    window.onload = async () => {
        if (!className) return window.location.href = "index.html";
        document.getElementById("displayClass").innerText = className;
        
        document.getElementById('termInput').value = activeTerm;
        document.getElementById('yearInput').value = activeYear;
        const today = new Date();
        document.getElementById('recordDate').value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

        try {
            const unlockSnap = await db.collection('Settings').doc('UnlockConfig').get();
            if (unlockSnap.exists && unlockSnap.data().classes) isClassUnlocked = unlockSnap.data().classes.includes(className);

            const holSnapshot = await db.collection('Holidays').get();
            holSnapshot.forEach(doc => { currentHolidays[doc.id] = doc.data().name; });
            const stuSnapshot = await db.collection('Students').get();
            stuSnapshot.forEach(doc => { let data = doc.data(); data.docId = doc.id; allStudents.push(data); });
            
            filterStudents(); 
        } catch (error) { console.error(error); }
    };

    function filterStudents() {
        const selectedTerm = document.getElementById('termInput').value;
        const selectedYear = document.getElementById('yearInput').value;
        let classKey = Object.keys(allStudents[0] || {}).find(k => k.includes("ชั้น") || k.includes("ห้อง")) || "ชั้นเรียน";
        currentStudents = allStudents.filter(std => {
            let classMatch = (std[classKey] === className);
            let termMatch = (std.term === selectedTerm || (!std.term && selectedTerm === activeTerm)); 
            let yearMatch = (std.academicYear === selectedYear || (!std.academicYear && selectedYear === activeYear));
            return classMatch && termMatch && yearMatch;
        });
        loadDailyData();
    }

    async function loadDailyData() {
        const dateVal = document.getElementById('recordDate').value;
        const selectedTerm = document.getElementById('termInput').value;
        const selectedYear = document.getElementById('yearInput').value;
        
        const alertBox = document.getElementById('holidayAlert');
        const tableBox = document.getElementById('tableContainer');
        const tbody = document.getElementById('tableBody');
        const banner = document.getElementById('readOnlyBanner');

        if(!dateVal) return;
        const todayStr = new Date().toISOString().split('T')[0];
        const isPastDate = (dateVal < todayStr);

        let isReadOnly = (selectedTerm !== activeTerm || selectedYear !== activeYear || isPastDate);

        if (isClassUnlocked) {
            isReadOnly = false;
            banner.style.display = "block";
            banner.className = "alert alert-success";
            banner.innerText = "🟢 แอดมินปลดล็อกให้ห้องนี้สามารถแก้ไขข้อมูลย้อนหลังได้";
        } else if (isReadOnly) {
            banner.style.display = "block";
            banner.className = "alert alert-warning";
            banner.innerText = "⚠️ โหมดดูข้อมูลย้อนหลัง (ไม่อนุญาตให้แก้ไข แจ้งแอดมินเพื่อปลดล็อก)";
        } else { banner.style.display = "none"; }

        const dayOfWeek = new Date(dateVal).getDay();
        let isHoliday = false; let holidayText = "";
        if (dayOfWeek === 0 || dayOfWeek === 6) { isHoliday = true; holidayText = "เสาร์-อาทิตย์"; } 
        else if (currentHolidays[dateVal]) { isHoliday = true; holidayText = currentHolidays[dateVal]; }

        if (isHoliday) {
            alertBox.style.display = "block"; document.getElementById('holidayName').innerText = holidayText;
            tableBox.style.display = "none"; return;
        }

        alertBox.style.display = "none"; tableBox.style.display = "block";
        if (currentStudents.length === 0) {
            tbody.innerHTML = "<tr><td colspan='3' style='padding:20px; color:var(--danger);'>ไม่มีข้อมูลนักเรียนในเทอม/ปีที่เลือก</td></tr>"; return;
        }

        tbody.innerHTML = "<tr><td colspan='3'>⏳ กำลังโหลดข้อมูล...</td></tr>";
        try {
            const recordsSnapshot = await db.collection('MilkRecords').where('className', '==', className).where('date', '==', dateVal).get();
            let savedRecords = {};
            recordsSnapshot.forEach(doc => { savedRecords[doc.data().studentId] = doc.data().status; });

            tbody.innerHTML = "";
            currentStudents.forEach((student, index) => {
                const stuId = student.docId;
                const isChecked = savedRecords[stuId] === true ? "checked" : "";
                const disabledAttr = isReadOnly ? "disabled" : "";
                tbody.innerHTML += `<tr>
                    <td>${index + 1}</td>
                    <td><b>${student['ชื่อ-สกุล'] || student['ชื่อ - สกุล'] || "-"}</b></td>
                    <td><input type="checkbox" id="cb_${stuId}" ${isChecked} ${disabledAttr} onchange="autoSaveMilk('${stuId}')"></td>
                </tr>`;
            });
        } catch (e) { tbody.innerHTML = `<tr><td colspan='3' style='color:var(--danger);'>❌ โหลดล้มเหลว</td></tr>`; }
    }

    async function autoSaveMilk(studentId) {
        const dateVal = document.getElementById('recordDate').value;
        const isChecked = document.getElementById(`cb_${studentId}`).checked;
        try {
            await db.collection('MilkRecords').doc(`${studentId}_${dateVal}`).set({ studentId: studentId, date: dateVal, status: isChecked, className: className }, { merge: true });
            showToast("✅ บันทึกอัตโนมัติเรียบร้อย");
        } catch (error) { console.error(error); }
    }
    
    function showToast(msg) {
        const t = document.getElementById('save-status'); t.innerText = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    async function exportMonthlyToExcel() {
        const dateVal = document.getElementById('recordDate').value; 
        const term = document.getElementById('termInput').value;
        const yearTh = document.getElementById('yearInput').value;
        if(!dateVal) return;
        const yyyy = dateVal.substring(0, 4); const mm = dateVal.substring(5, 7);
        const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        try {
            const recordsSnapshot = await db.collection('MilkRecords').where('className', '==', className).get();
            let monthRecords = {};
            recordsSnapshot.forEach(doc => {
                const data = doc.data();
                if(data.date.startsWith(`${yyyy}-${mm}`) && data.status === true) {
                    if(!monthRecords[data.studentId]) monthRecords[data.studentId] = {};
                    monthRecords[data.studentId][data.date] = true;
                }
            });
            let exportData = [["แบบฟอร์มบันทึกข้อมูลการดื่มนม"], [`ประจำเดือน ${thaiMonths[parseInt(mm)-1]}`, "", `โรงเรียน เสนาบดี`, "", `ภาคเรียนที่ ${term}`, "", `ปีการศึกษา ${yearTh}`, "", `ชั้น ${className}`]];
            let headers = ["ลำดับที่", "ชื่อ-สกุล", "วัน/เดือน/ปี เกิด"]; for (let i = 1; i <= 31; i++) headers.push(i);
            exportData.push(headers);
            currentStudents.forEach((student, index) => {
                let row = [index + 1, student['ชื่อ-สกุล'] || student['ชื่อ - สกุล'] || "", student['วันเกิด'] || student['วัน/เดือน/ปีเกิด'] || ""];
                for (let i = 1; i <= 31; i++) {
                    const testDateStr = `${yyyy}-${mm}-${String(i).padStart(2, '0')}`;
                    const dObj = new Date(testDateStr);
                    if (dObj.getMonth()+1 !== parseInt(mm) || dObj.getDay()===0 || dObj.getDay()===6 || currentHolidays[testDateStr]) { row.push(""); } 
                    else { row.push((monthRecords[student.docId] && monthRecords[student.docId][testDateStr]) ? "/" : ""); }
                }
                exportData.push(row);
            });
            const ws = XLSX.utils.aoa_to_sheet(exportData);
            ws['!cols'] = [{ wch: 8 }, { wch: 30 }, { wch: 15 }]; for (let i = 0; i < 31; i++) ws['!cols'].push({ wch: 4 });
            const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
            XLSX.writeFile(wb, `บันทึกดื่มนม_ชั้น${className.replace('/', '-')}_${thaiMonths[parseInt(mm)-1]}_${yearTh}.xlsx`);
        } catch (e) { alert("ข้อผิดพลาดในการโหลดข้อมูล"); }
    }
</script>
</body>
</html>
